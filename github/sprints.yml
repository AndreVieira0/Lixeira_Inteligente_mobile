# Lixeira Inteligente — Sprints / Etapas do roteiro de desenvolvimento
# Fonte: plano_dev.md, seções 23.1 (roteiro, Etapas 1 a 14) e 23.3 (responsabilidades).
#
# COMO EDITAR:
#   - Cada bloco com "- numero:" abaixo de `sprints:` é uma etapa.
#   - Mantenha cada valor em UMA ÚNICA LINHA, entre aspas duplas (o script lê o YAML
#     por linha). Valores com " ou \ interiores devem ser evitados/escapados.
#   - `areas` é a(s) área(s) responsável(is), separadas por vírgula: hardware, backend,
#     mobile, integracao. Cada área gera uma label correspondente.
#   - Adicione novas etapas no final; o script é idempotente e não duplica issues.

labels:
  - name: hardware
    color: "0E8A16"
    desc: "Hardware/Firmware — ESP32, HC-SR04, calibração, Wi-Fi"
  - name: backend
    color: "1D76DB"
    desc: "Backend/Firebase — Authentication, Firestore, FCM, regras"
  - name: mobile
    color: "E99695"
    desc: "Mobile — React Native, telas, dashboard, configurações"
  - name: integracao
    color: "FBCA04"
    desc: "Integração/Testes — fluxo completo e validação"

sprints:
  - numero: 1
    titulo: "Etapa 1 — Definição e preparação"
    descricao: "Consolidar requisitos, definir as dimensões da lixeira, separar os componentes e criar o repositório do projeto."
    entregavel: "Estrutura inicial do projeto, lista de componentes e backlog."
    responsavel: "Integração/Testes — planejamento conjunto (todos)"
    areas: "integracao"
    status: "Backlog"

  - numero: 2
    titulo: "Etapa 2 — Montagem do protótipo"
    descricao: "Montar ESP32 e HC-SR04, definir a posição de instalação do sensor e preparar a alimentação."
    entregavel: "Protótipo físico capaz de realizar leituras."
    responsavel: "Hardware/Firmware"
    areas: "hardware"
    status: "Backlog"

  - numero: 3
    titulo: "Etapa 3 — Leitura e calibração"
    descricao: "Programar as leituras do HC-SR04, testar diferentes posições e calibrar os valores correspondentes aos níveis de ocupação."
    entregavel: "Leitura estável convertida em percentual de ocupação."
    responsavel: "Hardware/Firmware"
    areas: "hardware"
    status: "Backlog"

  - numero: 4
    titulo: "Etapa 4 — Conectividade"
    descricao: "Implementar conexão Wi-Fi, reconexão e o modo de configuração inicial do dispositivo (sem QR Code)."
    entregavel: "Lixeira capaz de receber e manter sua configuração de rede."
    responsavel: "Hardware/Firmware"
    areas: "hardware"
    status: "Backlog"

  - numero: 5
    titulo: "Etapa 5 — Firebase"
    descricao: "Criar Authentication, Firestore e a estrutura de usuários, lixeiras, medições e configurações, com regras de segurança."
    entregavel: "Backend preparado para receber os dispositivos."
    responsavel: "Backend/Firebase"
    areas: "backend"
    status: "Backlog"

  - numero: 6
    titulo: "Etapa 6 — Envio das medições"
    descricao: "Integrar o ESP32 ao Firebase e definir a frequência de envio das leituras."
    entregavel: "Medições registradas automaticamente com data e hora."
    responsavel: "Hardware/Firmware com Backend/Firebase"
    areas: "hardware, backend"
    status: "Backlog"

  - numero: 7
    titulo: "Etapa 7 — Aplicativo base"
    descricao: "Criar o projeto React Native, autenticação, navegação e estrutura das telas."
    entregavel: "Usuário consegue criar conta e acessar o aplicativo."
    responsavel: "Mobile"
    areas: "mobile"
    status: "Backlog"

  - numero: 8
    titulo: "Etapa 8 — Cadastro e configuração da lixeira"
    descricao: "Implementar o fluxo de adicionar uma lixeira, vinculá-la ao usuário e configurar ou alterar sua rede Wi-Fi."
    entregavel: "Instalação e reconfiguração funcionando sem QR Code."
    responsavel: "Mobile com Hardware/Firmware"
    areas: "mobile, hardware"
    status: "Backlog"

  - numero: 9
    titulo: "Etapa 9 — Monitoramento"
    descricao: "Criar dashboard, tela de detalhes, nível atual, status, última atualização e histórico de medições."
    entregavel: "Usuário acompanha uma ou várias lixeiras remotamente."
    responsavel: "Mobile"
    areas: "mobile"
    status: "Backlog"

  - numero: 10
    titulo: "Etapa 10 — Notificações"
    descricao: "Integrar Firebase Cloud Messaging e criar preferências individuais para os limites de 80% e 100%, evitando alertas repetidos."
    entregavel: "Alertas enviados de acordo com a configuração do usuário."
    responsavel: "Backend/Firebase com Mobile"
    areas: "backend, mobile"
    status: "Backlog"

  - numero: 11
    titulo: "Etapa 11 — Prioridade de coleta"
    descricao: "Criar a primeira regra de classificação usando o nível atual e preparar a inclusão de velocidade de enchimento e histórico."
    entregavel: "Prioridade baixa, média ou alta para cada lixeira."
    responsavel: "Backend/Firebase com Mobile"
    areas: "backend, mobile"
    status: "Backlog"

  - numero: 12
    titulo: "Etapa 12 — Múltiplos usuários"
    descricao: "Permitir associação de uma lixeira a mais de um usuário e validar o controle de permissões."
    entregavel: "Usuários autorizados conseguem acompanhar a mesma lixeira."
    responsavel: "Backend/Firebase com Mobile"
    areas: "backend, mobile"
    status: "Backlog"

  - numero: 13
    titulo: "Etapa 13 — Integração completa"
    descricao: "Validar o fluxo sensor → ESP32 → Wi-Fi → Firebase → aplicativo → notificação."
    entregavel: "Sistema funcionando de ponta a ponta."
    responsavel: "Integração/Testes — em conjunto"
    areas: "integracao"
    status: "Backlog"

  - numero: 14
    titulo: "Etapa 14 — Testes e ajustes"
    descricao: "Testar precisão, conectividade, troca de Wi-Fi, múltiplas lixeiras, múltiplos usuários e notificações."
    entregavel: "MVP estável e pronto para demonstração."
    responsavel: "Integração/Testes"
    areas: "integracao"
    status: "Backlog"